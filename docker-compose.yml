# Runs the shop plus Caddy, which gets and renews the HTTPS certificate for you automatically.
# 1) Copy .env.example to .env and fill it in.   2) Put your domain in the DOMAIN line of .env.
# 3) docker compose up -d --build
services:
  shop:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_PATH: /data/scentaura.db
      UPLOAD_DIR: /data/uploads
    volumes:
      - shopdata:/data
    expose:
      - "3000"
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on:
      - shop
volumes:
  shopdata:
  caddydata:
